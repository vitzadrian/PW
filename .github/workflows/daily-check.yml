name: Daily Data Check

on:
  schedule:
    - cron: "0 6 * * 1-6"  # daily Mon-Sat at 06:00 UTC
    - cron: "0 5 * * 0"    # weekly full reset on Sundays at 05:00 UTC
  workflow_dispatch:
    inputs:
      force_reset:
        description: "Force full data reset"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install dependencies
        run: npm ci

      - name: Clear cache for weekly reset
        if: github.event.schedule == '0 5 * * 0' || github.event.inputs.force_reset == 'true'
        run: rm -rf src/.observablehq/cache

      - name: Run daily check or full reload
        run: python src/data/check_updates.py

      - name: Commit updated cache if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add src/.observablehq/cache
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "chore: update data cache [skip ci]" && git push)

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4